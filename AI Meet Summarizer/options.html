<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Meet Summariser Settings</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: rgba(22, 28, 45, 0.65);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        
        --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        --primary-glow: rgba(99, 102, 241, 0.35);
        
        --success: #10b981;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        padding: 40px 20px;
        max-width: 500px;
        margin: 0 auto;
        position: relative;
        overflow-x: hidden;
      }

      /* Glow background decoration */
      body::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, rgba(0,0,0,0) 75%);
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 20px;
        background: linear-gradient(to right, #ffffff, #d8b4fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .description {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 24px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
      }

      label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
      }

      input[type="text"] {
        font-family: 'Outfit', sans-serif;
        width: 100%;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
        transition: all 0.2s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #a78bfa;
        box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15);
      }

      .help-link {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .help-link a {
        color: #a78bfa;
        text-decoration: none;
        font-weight: 500;
      }

      .help-link a:hover {
        text-decoration: underline;
      }

      button {
        font-family: 'Outfit', sans-serif;
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: var(--primary-gradient);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px var(--primary-glow);
      }

      button:hover {
        filter: brightness(1.1);
        box-shadow: 0 6px 16px var(--primary-glow);
      }

      button:active {
        transform: scale(0.98);
      }

      .success-message {
        display: none;
        color: var(--success);
        font-size: 13px;
        font-weight: 500;
        margin-top: 12px;
        text-align: center;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎙️ AI Meet Summariser Settings</h1>
      <p class="description">
        Configure the extension settings to enable AI-powered summaries, Q&A extractions, and task assignments for Google Meet calls.
      </p>

      <div class="form-group">
        <label for="api-key">Gemini API Key:</label>
        <input type="text" id="api-key" placeholder="Enter your Gemini API key" />
        <span class="help-link">
          Get an API key from 
          <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a>.
        </span>
      </div>

      <button id="save-button">Save Settings</button>
      <div id="success-message" class="success-message">
        ✓ Settings saved successfully!
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
